name: Cancha CMS migration
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Migration phase (docs/cms-consolidation-plan-2026-10-25.md)'
        type: choice
        default: preview
        options: [preview]
permissions:
  contents: write
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fresh restore point in the encrypted store before any Framer write; never a public artifact.
      - name: Encrypted backup
        run: npm run backup:cms-consolidation -- --encrypted-store > /dev/null
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      # Logs carry counts and checks only, never item content.
      - name: Migrate (${{ inputs.phase }})
        run: node scripts/migrate-retiring-collections.mjs
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          PHASE: ${{ inputs.phase }}
