name: Cancha publish slot waiter
on:
  workflow_dispatch:
  schedule:
    # GitHub delays scheduled runs by up to hours. Start often in the 2.5 hours before
    # 12:30 PM and 6 PM New York (UTC hours cover both daylight and standard time).
    - cron: '7,27,47 14-17,19-22 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: cancha-publish-slot-waiter
  cancel-in-progress: false
jobs:
  wait:
    if: github.event_name == 'workflow_dispatch' || vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Dispatches only the existing publisher; it never posts, reads secrets or changes state itself.
      - run: node scripts/publish-slot-waiter.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
