name: Cancha comparison carousels
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated carousel ids to render (empty = all in content/instagram/comparison-carousels.json)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner image already has Google Chrome.
      - name: Render carousels
        env:
          ONLY: ${{ inputs.only }}
          CHROME_CHANNEL: chrome
        run: node scripts/render-comparison-carousels.mjs
      # Pinned static build, as in github-instagram.yml (apt mirrors stalled on the runner image, Oct 27).
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ff" ffmpeg-static@5.2.0
            mkdir -p "$HOME/bin"
            ln -sf "$(node -p "require('$RUNNER_TEMP/ff/node_modules/ffmpeg-static')")" "$HOME/bin/ffmpeg"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Render Reel versions
        env:
          ONLY: ${{ inputs.only }}
          CHROME_CHANNEL: chrome
        run: node scripts/render-comparison-reels.mjs
      # Rendered slides, Reels and alt text only; no credentials or private data.
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-carousels-${{ github.run_id }}
          path: |
            private-data/comparison-carousels/*.jpg
            private-data/comparison-carousels/report.json
            private-data/comparison-reels/*.mp4
            private-data/comparison-reels/*.jpg
            private-data/comparison-reels/report.json
          retention-days: 14
  # Hosts approved carousels on Framer and imports them into the encrypted posting queue. The existing
  # publisher posts them in the 12:30 / 6 PM slots under its usual caps, spacing and source rechecks.
  queue:
    needs: render
    if: vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cancha-private-automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comparison-carousels-${{ github.run_id }}
          path: private-data/
      - name: Host approved carousels
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
        run: node scripts/prepare-comparison-carousels.mjs
      - name: Import into the posting queue
        run: |
          if [ "$(node -p "require('./private-data/comparison-carousels-ready.json').length" 2>/dev/null || echo 0)" = "0" ]; then echo "Nothing to import"; exit 0; fi
          node scripts/github-instagram.mjs refresh-comparison-carousels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          CANCHA_AUTOMATION_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
          CANCHA_SCHEDULE_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
