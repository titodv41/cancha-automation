name: Cancha website update
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Reviewed website change to publish'
        type: choice
        options: [site-seo-pass, create-hub-pages, create-guide-pages, publish-reviewed-code, apply-reviewed-opportunities]
      batch:
        description: 'apply-reviewed-opportunities only: config/reviewed-opportunities/<file>.json'
        type: string
        default: ''
      apply:
        description: 'apply-reviewed-opportunities only: write and publish (unchecked = dry run)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Publishes only the pages the script names; logs carry titles and checks, no private data.
      - run: node scripts/${{ inputs.script }}.mjs ${{ inputs.script == 'apply-reviewed-opportunities' && inputs.apply && '--apply' || '' }}
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          BATCH: ${{ inputs.batch }}
