name: Cancha CMS consolidation backup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:connection
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      # Seals the snapshot into the encrypted automation-state store. Never upload raw backups:
      # this repository is public, so workflow artifacts are not private.
      - run: npm run backup:cms-consolidation -- --encrypted-store
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
    # Read-only toward Framer: step 1 of docs/cms-consolidation-plan-2026-10-25.md.
