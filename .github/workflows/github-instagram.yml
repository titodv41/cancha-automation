name: Cancha Instagram on GitHub
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'migrate once, then prepare/publish/review/pause/resume/command'
        type: choice
        default: review
        options: [migrate, prepare, publish, review, pause, resume, command, reconnect, connect-insights, connect-insights-user, diagnose-insights, verify, insights, refresh-creative, refresh-community, refresh-local-stories, refresh-photo-stories, refresh-product-posts, refresh-motion-stories, repair-media, replenish]
      command_file:
        description: 'Repository JSON command path; only used for command'
        type: string
        default: 'content/instagram/chat-command.json'
  schedule:
    # One set of UTC production triggers avoids duplicate DST jobs cancelling
    # a useful pending run. Feed slots remain 12:30 and 18:00 New York.
    - cron: '23 13,17 * * *'
    - cron: '9 14 * * *'
    - cron: '19 16 * * *'
    # Check publication twice an hour; actual spacing/day/week caps still apply.
    - cron: '11,41 0-3,16-23 * * *'
permissions:
  contents: write
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  automate:
    if: github.event_name == 'workflow_dispatch' || vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.action }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        # Select the intended trigger, not the hour the delayed runner starts.
        run: node scripts/github-schedule.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.action != ''
        with:
          node-version: 24
          cache: npm
      - if: steps.clock.outputs.action != ''
        run: npm ci
      - id: preparation
        if: steps.clock.outputs.action == 'prepare'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
        run: node scripts/check-preparation-needed.mjs >> "$GITHUB_OUTPUT"
      - if: (steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true') || steps.clock.outputs.action == 'replenish'
        run: npx playwright install --with-deps chromium
      - name: Install locked video renderer
        if: steps.clock.outputs.action == 'replenish'
        run: |
          npm ci --prefix video
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - uses: actions/cache/restore@v4
        if: steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true'
        with:
          path: private-data/municipal-source-cache
          key: cancha-municipal-sources-${{ github.run_id }}
          restore-keys: cancha-municipal-sources-
      - name: Run private automation
        if: steps.clock.outputs.action != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          CANCHA_CONTROL_TOKEN: ${{ steps.clock.outputs.action == 'migrate' && secrets.CANCHA_CONTROL_TOKEN || '' }}
          META_PAGE_ACCESS_TOKEN: ${{ (steps.clock.outputs.action == 'reconnect' || steps.clock.outputs.action == 'connect-insights' || steps.clock.outputs.action == 'diagnose-insights') && secrets.META_PAGE_ACCESS_TOKEN || '' }}
          META_APP_SECRET: ${{ (steps.clock.outputs.action == 'diagnose-insights' || steps.clock.outputs.action == 'connect-insights' || steps.clock.outputs.action == 'connect-insights-user') && secrets.META_APP_SECRET || '' }}
          META_USER_ACCESS_TOKEN: ${{ steps.clock.outputs.action == 'connect-insights-user' && secrets.META_USER_ACCESS_TOKEN || '' }}
          FRAMER_API_KEY: ${{ ((steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true') || steps.clock.outputs.action == 'repair-media' || steps.clock.outputs.action == 'replenish') && secrets.FRAMER_API_KEY || '' }}
          ELEVENLABS_API_KEY: ${{ steps.clock.outputs.action == 'replenish' && secrets.ELEVENLABS_API_KEY || '' }}
          CANCHA_AUTOMATION_BACKEND: github
          CANCHA_SCHEDULE_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
          CANCHA_COMMAND_FILE: ${{ inputs.command_file }}
          ACTION: ${{ steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'false' && 'review' || steps.clock.outputs.action }}
        run: node scripts/github-instagram.mjs "$ACTION"
      - uses: actions/cache/save@v4
        if: always() && steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true'
        with:
          path: private-data/municipal-source-cache
          key: cancha-municipal-sources-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.clock.outputs.action != ''
        with:
          name: cancha-status-${{ github.run_id }}
          path: |
            private-data/github-summary.json
            private-data/instagram-preview.html
            private-data/instagram-insights.json
            private-data/meta-insights-connection.json
            private-data/meta-token-diagnostic.json
            private-data/narrative-production/report.json
            private-data/automatic-news/report.json
            private-data/automatic-news/voice/
            private-data/local-updates/report.json
            private-data/daily-opportunities/*/directory-editorial/report.json
          retention-days: 7
          if-no-files-found: error
    # Never upload plaintext Meta tokens, decrypted state, contacts or CMS backups.
