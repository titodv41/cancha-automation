name: Cancha Instagram on GitHub
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'migrate once, then prepare/publish/review/pause/resume/command'
        type: choice
        default: review
        options: [migrate, prepare, publish, review, pause, resume, command, reconnect, verify, insights, refresh-creative, refresh-community, refresh-local-stories, refresh-photo-stories, refresh-motion-stories, repair-media]
      command_file:
        description: 'Repository JSON command path; only used for command'
        type: string
        default: 'content/instagram/chat-command.json'
  schedule:
    # Prepare at 10 AM NY for 12:30 PM and 6 PM source-checked slots.
    # Publish after 6 PM; GitHub schedules are approximate and can be delayed.
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'
    # Noon fallback checks whether preparation completed today before doing work.
    - cron: '17 16 * * *'
    - cron: '17 17 * * *'
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
    # Midday/evening checks; plan caps and four-hour spacing protect delayed runs.
    - cron: '37 0-4,16-23 * * *'
permissions:
  contents: write
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  automate:
    if: github.event_name == 'workflow_dispatch' || vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.action }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        # Select the intended trigger, not the hour the delayed runner starts.
        run: node scripts/github-schedule.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.action != ''
        with:
          node-version: 24
          cache: npm
      - if: steps.clock.outputs.action != ''
        run: npm ci
      - id: preparation
        if: steps.clock.outputs.action == 'prepare'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
        run: node scripts/check-preparation-needed.mjs >> "$GITHUB_OUTPUT"
      - if: steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        if: steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true'
        with:
          path: private-data/municipal-source-cache
          key: cancha-municipal-sources-${{ github.run_id }}
          restore-keys: cancha-municipal-sources-
      - name: Run private automation
        if: steps.clock.outputs.action != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          CANCHA_CONTROL_TOKEN: ${{ steps.clock.outputs.action == 'migrate' && secrets.CANCHA_CONTROL_TOKEN || '' }}
          META_PAGE_ACCESS_TOKEN: ${{ steps.clock.outputs.action == 'reconnect' && secrets.META_PAGE_ACCESS_TOKEN || '' }}
          FRAMER_API_KEY: ${{ ((steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true') || steps.clock.outputs.action == 'repair-media') && secrets.FRAMER_API_KEY || '' }}
          CANCHA_AUTOMATION_BACKEND: github
          CANCHA_SCHEDULE_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
          CANCHA_COMMAND_FILE: ${{ inputs.command_file }}
          ACTION: ${{ steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'false' && 'review' || steps.clock.outputs.action }}
        run: node scripts/github-instagram.mjs "$ACTION"
      - uses: actions/cache/save@v4
        if: always() && steps.clock.outputs.action == 'prepare' && steps.preparation.outputs.needed == 'true'
        with:
          path: private-data/municipal-source-cache
          key: cancha-municipal-sources-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: success() && steps.clock.outputs.action != ''
        with:
          name: cancha-status-${{ github.run_id }}
          path: |
            private-data/github-summary.json
            private-data/instagram-preview.html
            private-data/instagram-insights.json
          retention-days: 7
          if-no-files-found: error
    # Never upload plaintext Meta tokens, decrypted state, contacts or CMS backups.
