name: Cancha app database keepalive
# Supabase pauses Free-plan projects after about a week of low activity (it paused on Nov 13 and the website
# waitlist form failed). One public read a day keeps it awake. The publishable key below already ships in the
# website and the app; RLS only lets it read published, open openings.
on:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one public row
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            'https://ipyaljmbumgvnpkjnbag.supabase.co/rest/v1/openings?select=id&limit=1' \
            -H 'apikey: sb_publishable_XGeHJnRGPPVyrLQYwTAeKg_hwxBC5ps')
          echo "status=$code"
          # A paused or broken database must turn this job red so it is noticed.
          test "$code" = 200
