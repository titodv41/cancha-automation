name: Cancha daily opportunity review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-opportunities.yml'
      - 'config/opportunity-workflow.json'
      - 'scripts/daily-opportunities.mjs'
      - 'scripts/prepare-opportunities.mjs'
      - 'scripts/automate-opportunities.mjs'
      - 'scripts/source-parser.mjs'
      - 'config/automated-organizers.json'
      - 'server/opportunity-policy.mjs'
      - 'server/offer-expiry.mjs'
      - 'server/source-verification.mjs'
      - 'package*.json'
  schedule:
    # Both UTC hours cover 09:00 New York across daylight saving changes.
    - cron: '0 13,14 * * 1-5'
permissions:
  contents: read
concurrency:
  group: daily-opportunities
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || [ "$(TZ=America/New_York date +%H)" = 09 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.clock.outputs.run == 'true'
        run: npm ci
      - if: steps.clock.outputs.run == 'true'
        run: npm test
      - if: steps.clock.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.clock.outputs.run == 'true'
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          CANCHA_AUTOMATION_URL: ${{ vars.CANCHA_AUTOMATION_URL }}
          CANCHA_AUTOMATION_INGEST_SECRET: ${{ secrets.CANCHA_AUTOMATION_INGEST_SECRET }}
        run: npm run opportunities:automate
      - uses: actions/upload-artifact@v4
        if: steps.clock.outputs.run == 'true'
        with:
          name: opportunity-review-${{ github.run_id }}
          path: private-data/daily-opportunities/
          retention-days: 7
          if-no-files-found: error
    # With a secure Framer key and private backup host, checked jobs enter
    # unpublished Framer changes and Instagram drafts await owner review.
    # No site publication and no Meta token in this workflow.
