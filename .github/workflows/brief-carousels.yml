name: Cancha brief carousels
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated brief ids to render (empty = all in content/instagram/brief-carousels.json)'
        type: string
        default: ''
  # Keep approved briefs postable (scripts/keep-fresh.mjs): re-render the ones still inside their fact window in a quiet
  # hour (05:20 UTC), so the job never pushes a pending publish run out of the shared concurrency group.
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.pick.outputs.only }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          # GitHub can start a scheduled run hours late (Nov 9-10: 13:30 and 15:01 UTC). Outside the quiet window
          # (04:00-11:59 UTC) a late refresh could displace a pending publish run, so it skips.
          H=$(date -u +%H)
          if [ "$EVENT" = schedule ] && { [ "$H" -ge 12 ] || [ "$H" -lt 4 ]; }; then echo "Late scheduled start; skipping"; ONLY=""; RUN=false
          elif [ "$EVENT" = schedule ]; then ONLY="$(node scripts/keep-fresh.mjs briefs)"; RUN=$([ -n "$ONLY" ] && echo true || echo false); else ONLY="$INPUT_ONLY"; RUN=true; fi
          [[ "$ONLY" =~ ^[a-z0-9,-]*$ ]] || { echo "Invalid brief list"; exit 1; }
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"; echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "Briefs: ${ONLY:-all} (run=$RUN)"
  render:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner image already has Google Chrome.
      - name: Render carousels
        env:
          ONLY: ${{ needs.pick.outputs.only }}
          CHROME_CHANNEL: chrome
        run: node scripts/render-brief-carousels.mjs
      # Rendered slides and alt text only; no credentials or private data.
      - uses: actions/upload-artifact@v4
        with:
          name: brief-carousels-${{ github.run_id }}
          path: |
            private-data/brief-carousels/*.jpg
            private-data/brief-carousels/report.json
          retention-days: 14
  # Hosts approved briefs on Framer and imports them into the encrypted posting queue. The existing
  # publisher posts them in the 12:30 / 6 PM slots under its usual caps, spacing and source rechecks.
  queue:
    needs: [pick, render]
    if: vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cancha-private-automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A single-folder upload stores files at the artifact root, so download back into that folder.
      - uses: actions/download-artifact@v4
        with:
          name: brief-carousels-${{ github.run_id }}
          path: private-data/brief-carousels/
      - name: Host approved carousels
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
        run: node scripts/prepare-brief-carousels.mjs
      - name: Import into the posting queue
        run: |
          if [ "$(node -p "require('./private-data/brief-carousels-ready.json').length" 2>/dev/null || echo 0)" = "0" ]; then echo "Nothing to import"; exit 0; fi
          # One brief per import: a single brief whose source changed must not block the others (keep-fresh, Nov 7).
          node -e "const d=require('./private-data/brief-carousels-ready.json');d.forEach((x,i)=>require('fs').writeFileSync('private-data/brief-ready-'+i+'.json',JSON.stringify([x])))"
          status=0
          for f in private-data/brief-ready-*.json; do
            BRIEF_CAROUSELS_FILE="$f" node scripts/github-instagram.mjs refresh-brief-carousels || { echo "Not imported: $(node -p "require('./$f')[0].id")"; status=1; }
          done
          exit $status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          CANCHA_AUTOMATION_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
          CANCHA_SCHEDULE_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
