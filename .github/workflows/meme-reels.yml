name: Cancha meme Reels
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated Reel ids to render (empty = all in content/instagram/meme-reels.json)'
        type: string
        default: ''
  schedule:
    # Weekly batch; the production clock does not depend on this.
    - cron: '17 15 * * 1'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner image already has Google Chrome. Pinned static ffmpeg/ffprobe builds avoid slow apt mirrors.
      - name: Static ffmpeg
        run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5.2.0 ffprobe-static@3.1.0
          mkdir -p "$HOME/bin"
          ln -sf "$(node -p "require('ffmpeg-static')")" "$HOME/bin/ffmpeg"
          ln -sf "$(node -p "require('ffprobe-static').path")" "$HOME/bin/ffprobe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ffmpeg" -hide_banner -filters | grep -E ' (xfade|signalstats|zoompan) ' | wc -l
      # Searches every footage query the Reels use and downloads licensed clips: YouTube CC videos mirrored on
      # Wikimedia Commons, Commons CC0/CC BY, Pixabay and Mixkit, plus official media from featured clubs' own sites.
      - name: Build footage library
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DOWNLOAD_PER_QUERY: '4'
        run: |
          export QUERIES="$(node -e "const r=require('./content/instagram/meme-reels.json').reels;console.log([...new Set(r.flatMap(x=>x.segments.map(s=>s.footage)))].join(','))")"
          export CLUBS="$(node -e "const r=require('./content/instagram/meme-reels.json').reels;console.log([...new Set(r.flatMap(x=>x.segments.map(s=>s.club).filter(Boolean)))].join(','))")"
          node scripts/footage-library.mjs
      - name: Render Reels
        env:
          ONLY: ${{ inputs.only }}
          CHROME_CHANNEL: chrome
        run: node scripts/render-meme-reels.mjs
      # Rendered Reels, posters and the footage/licence report; no credentials.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-reels-${{ github.run_id }}
          path: |
            private-data/meme-reels/*.mp4
            private-data/meme-reels/*.jpg
            private-data/meme-reels/report.json
            private-data/footage/library.json
          retention-days: 14
  # Hosts approved Reels on Framer and imports them into the encrypted posting queue. The existing
  # publisher posts them in the 12:30 / 6 PM slots under its usual caps, spacing and media-mix rules.
  queue:
    needs: render
    if: github.event_name == 'workflow_dispatch' || vars.CANCHA_AUTOMATION_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cancha-private-automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: meme-reels-${{ github.run_id }}
          path: private-data/
      - name: Host approved Reels
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
        run: node scripts/prepare-short-reels.mjs
      - name: Import into the posting queue
        run: |
          if [ "$(node -p "require('./private-data/short-reels-ready.json').length" 2>/dev/null || echo 0)" = "0" ]; then echo "Nothing to import"; exit 0; fi
          node scripts/github-instagram.mjs refresh-short-reels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
          CANCHA_AUTOMATION_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
          CANCHA_SCHEDULE_BACKEND: ${{ vars.CANCHA_AUTOMATION_BACKEND }}
