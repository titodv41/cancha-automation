name: Cancha stock footage search
on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Comma-separated Pixabay video searches (max 15)'
        type: string
        default: 'kids soccer, soccer practice, soccer parents, soccer fans'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/stock-footage-search.mjs
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          QUERIES: ${{ inputs.queries }}
      # Public clip metadata and CDN links only; the key is never written.
      - uses: actions/upload-artifact@v4
        with:
          name: stock-footage-${{ github.run_id }}
          path: private-data/stock-footage.json
          retention-days: 7
