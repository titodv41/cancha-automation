name: Cancha draft footage
# Owner, Nov 17: Claude makes drafts from real club footage first; the owner gets the club's OK afterwards and
# says when to post. This job only downloads public videos for those drafts and keeps them for 3 days. It never
# posts, renders or touches the posting queue. Clips only enter a Reel after they are registered in
# config/clip-permissions.json with the owner's OK.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated YouTube video IDs (11 characters each, up to 6)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cancha-draft-footage
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the IDs
        env:
          IDS: ${{ inputs.ids }}
        run: |
          [[ "$IDS" =~ ^[A-Za-z0-9_-]{11}(,[A-Za-z0-9_-]{11}){0,5}$ ]] || { echo "Give up to 6 comma-separated 11-character YouTube IDs"; exit 1; }
          mkdir -p clips
          tr ',' '\n' <<< "$IDS" | sed 's#^#https://www.youtube.com/watch?v=#' > clips/urls.txt
      # The burner cookies live in a 0600 temp file for this step only (same handling as creator-cuts.yml).
      - name: Download
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          pip install --quiet -U "yt-dlp[default]"
          umask 077
          COOKIES="$RUNNER_TEMP/yt-cookies.txt"
          printf '%s\n' "$YOUTUBE_COOKIES" > "$COOKIES"
          set +e
          yt-dlp --cookies "$COOKIES" -f "bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/bv*[height<=1080]+ba/b" --merge-output-format mp4 \
            -o "clips/%(id)s.%(ext)s" --no-playlist --max-filesize 600M --no-progress \
            -a clips/urls.txt 2>&1 | grep -v -i cookie | tail -20
          status=${PIPESTATUS[0]}
          rm -f "$COOKIES"
          rm -f clips/urls.txt
          ls -la clips
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: draft-footage-${{ github.run_id }}
          path: clips/*.mp4
          retention-days: 3
