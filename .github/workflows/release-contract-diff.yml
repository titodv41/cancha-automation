name: Cancha website release contract diff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Read-only toward Framer: reports what changed since the last reviewed website release.
      - run: node scripts/release-contract-diff.mjs
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
