name: Cancha website read-only reports
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Read-only Framer report to run'
        type: choice
        default: release-contract-diff
        options: [release-contract-diff, inspect-cms-structure, agent-dsl-reference, scan-retiring-references, page-metadata-report]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Read-only toward Framer: reports what changed since the last reviewed website release.
      - run: node scripts/${{ inputs.script || 'release-contract-diff' }}.mjs
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
