name: Cancha reconcile uncertain post
# Nov 18: resolves a post left Publishing / Needs reconciliation by checking Instagram (read-only). Found -> Published
# with the real receipt; not found -> Failed, never retried. Run without apply first to see the result.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Record the outcome in the encrypted state'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cancha-private-automation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/reconcile-uncertain.mjs ${{ inputs.apply && '--apply' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANCHA_GITHUB_STATE_KEY: ${{ secrets.CANCHA_GITHUB_STATE_KEY }}
